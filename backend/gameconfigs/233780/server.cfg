// Arma 3 dedicated server — generated starter config.
// Full reference: https://community.bistudio.com/wiki/Arma_3:_Server_Config_File
hostname        = "$name";
password        = "$password";          // join password; blank for open
passwordAdmin   = "$admin_password";    // #login <this> in chat
maxPlayers      = $players;
persistent      = 1;
logFile         = "server_console.log";
motd[]          = {"$name"};
motdInterval    = 30;
verifySignatures = 2;
kickDuplicate   = 1;
allowedFilePatching = 1;
timeStampFormat = "short";

class Missions {};
